name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-tidy
      run: sudo apt-get update && sudo apt-get install -y clang-tidy cmake ninja-build

    - name: Configure (clang-tidy)
      run: |
        cmake -S . -B build-tidy -G Ninja \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: |
        clang-tidy -p build-tidy \
        --config-file=.github/.clang-tidy \
        lib/*.cpp

  analyzer:
    name: clang static analyzer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare scan-build log dir
      run: |
        mkdir -p scan-build-reports
        : > scan-build-reports/scan-build.log

    - name: Install scan-build
      run: sudo apt-get update && sudo apt-get install -y clang-tools cmake ninja-build

    - name: Analyze build
      run: |
        set -o pipefail
        scan-build --status-bugs -o scan-build-reports \
        cmake -S . -B build-analyze -G Ninja 2>&1 | tee -a scan-build-reports/scan-build.log
        scan-build --status-bugs -o scan-build-reports \
        cmake --build build-analyze 2>&1 | tee -a scan-build-reports/scan-build.log

    - name: Upload scan-build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scan-build-log
        path: scan-build-reports

  tests:
    name: unit tests (${{ matrix.os }}, ${{ matrix.build_type }}, ${{ matrix.cpp_compiler }}) with sanitizers
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        cpp_compiler: [g++, clang++, cl]
        include:
          - os: windows-latest
            build_type: Release
            cpp_compiler: cl
            cxx_sanitize_flags: "/fsanitize=address /Zi"
            cxx_link_flags: "/DEBUG /INCREMENTAL:NO"
            asan_options: "abort_on_error=1"
            ubsan_options: ""
          - os: windows-latest
            build_type: Debug
            cpp_compiler: cl
            cxx_sanitize_flags: "/fsanitize=address /Zi"
            cxx_link_flags: "/DEBUG /INCREMENTAL:NO"
            asan_options: "abort_on_error=1"
            ubsan_options: ""
          - os: ubuntu-latest
            build_type: Release
            cpp_compiler: g++
            cxx_sanitize_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            cxx_link_flags: "-fsanitize=address,undefined"
            asan_options: "detect_leaks=1:halt_on_error=1"
            ubsan_options: "print_stacktrace=1"
          - os: ubuntu-latest
            build_type: Debug
            cpp_compiler: g++
            cxx_sanitize_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            cxx_link_flags: "-fsanitize=address,undefined"
            asan_options: "detect_leaks=1:halt_on_error=1"
            ubsan_options: "print_stacktrace=1"
          - os: ubuntu-latest
            build_type: Release
            cpp_compiler: clang++
            cxx_sanitize_flags: "-fsanitize=memory -fno-omit-frame-pointer -g -fsanitize-ignorelist=$GITHUB_WORKSPACE/.github/.msan_ignorelist -stdlib=libc++ -isystem ${{ github.workspace }}/libcxx_msan/include/c++/v1"
            cxx_link_flags: "-fsanitize=memory -stdlib=libc++ -L${{ github.workspace }}/libcxx_msan/lib -Wl,-rpath,${{ github.workspace }}/libcxx_msan/lib"
            asan_options: ""
            ubsan_options: ""
          - os: ubuntu-latest
            build_type: Debug
            cpp_compiler: clang++
            cxx_sanitize_flags: "-fsanitize=memory -fno-omit-frame-pointer -g -fsanitize-ignorelist=$GITHUB_WORKSPACE/.github/.msan_ignorelist -stdlib=libc++ -isystem ${{ github.workspace }}/libcxx_msan/include/c++/v1"
            cxx_link_flags: "-fsanitize=memory -stdlib=libc++ -L${{ github.workspace }}/libcxx_msan/lib -Wl,-rpath,${{ github.workspace }}/libcxx_msan/lib"
            asan_options: ""
            ubsan_options: ""
        exclude:
          - os: windows-latest
            cpp_compiler: g++
          - os: windows-latest
            cpp_compiler: clang++
          - os: ubuntu-latest
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Cache instrumented libc++
      if: matrix.cpp_compiler == 'clang++' && contains(matrix.cxx_sanitize_flags, 'memory')
      id: cache-libcxx
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/libcxx_msan
        key: libcxx-msan-18-v1

    - name: Build instrumented libc++
      if: matrix.cpp_compiler == 'clang++' && contains(matrix.cxx_sanitize_flags, 'memory') && steps.cache-libcxx.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update && sudo apt-get install -y ninja-build
        git clone --depth=1 https://github.com/llvm/llvm-project.git
        cd llvm-project
        cmake -GNinja -S runtimes -B build \
          -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLLVM_USE_SANITIZER=Memory \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/libcxx_msan
        ninja -C build cxx cxxabi
        ninja -C build install-cxx install-cxxabi

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_CXX_FLAGS="${{ matrix.cxx_sanitize_flags }}"
        -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxx_link_flags }}"
        -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.cxx_link_flags }}"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Add ASAN runtime to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Find Visual Studio installation
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        
        # Add VC Tools bin directory to PATH (contains ASAN DLLs)
        $vcToolsVersion = Get-Content "$vsPath\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
        $vcToolsVersion = $vcToolsVersion. Trim()
        $asanPath = "$vsPath\VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64"
        
        echo $asanPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "Added to PATH: $asanPath"

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      env:
        ASAN_OPTIONS: ${{ matrix.asan_options }}
        UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install coverage tools
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build lcov

    - name: Configure with coverage flags
      run: |
        cmake -S . -B build-cov -G Ninja \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_CXX_FLAGS="--coverage"

    - name: Build
      run: cmake --build build-cov

    - name: Run tests
      run: ctest --test-dir build-cov --output-on-failure

    - name: Collect coverage
      run: |
        lcov --capture --directory build-cov --output-file coverage.info
        lcov --remove coverage.info '*/gtest_lite.h' --output-file coverage.info
        genhtml coverage.info --output-directory coverage-html

    - name: Check line coverage threshold
      run: |
        SUMMARY=$(lcov --summary coverage.info 2>&1)
        LINE_COV=$(echo "$SUMMARY"  | grep -oP 'lines\.*:\s*\K[\d.]+(?=%)')
        FUNC_COV=$(echo "$SUMMARY"  | grep -oP 'functions\.*:\s*\K[\d.]+(?=%)')
        echo "Line coverage:     ${LINE_COV}%"
        echo "Function coverage: ${FUNC_COV}%"
        awk -v lc="$LINE_COV" -v fc="$FUNC_COV" 'BEGIN {
          if (lc + 0 < 85.0) { print "Line coverage "     lc "% is below 85% threshold"; exit 1 }
          if (fc + 0 < 75.0) { print "Function coverage " fc "% is below 75% threshold"; exit 1 }
        }'

    - name: Upload HTML coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: coverage-html
